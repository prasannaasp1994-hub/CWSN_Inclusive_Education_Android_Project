
name: Build CWSN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build CWSN App
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      # 1. Download repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract updated CWSN project
      - name: Extract CWSN project ZIP
        run: |
          ZIP="CWSN_Inclusive_Education_GitHub_Build_Colorful_Icon_Download_Fix.zip"

          if [ ! -f "$ZIP" ]; then
            echo "Updated project ZIP not found!"
            ls -la
            exit 1
          fi

          unzip -o "$ZIP"

          test -d CWSN_Inclusive_Education_Android_Project/app

      # 3. Install Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Install Android SDK
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Setup Gradle
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Build Android APK
      - name: Build CWSN APK
        run: |
          cd CWSN_Inclusive_Education_Android_Project

          gradle --no-daemon clean :app:assembleDebug

      # 7. Verify APK
      - name: Verify APK
        run: |
          APK="CWSN_Inclusive_Education_Android_Project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK file not generated"
            exit 1
          fi

          ls -lh "$APK"

      # 8. Upload APK
      - name: Upload CWSN APK
        uses: actions/upload-artifact@v4
        with:
          name: CWSN-Inclusive-Education-APK
          path: CWSN_Inclusive_Education_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
